name: CI

# 持续兼容性检查：核心模块（仓库根目录）与 native 模块分别构建、检查和测试。
# 需要固定版本做二分排查时，在安装步骤前设置 MOONBIT_INSTALL_VERSION。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心模块 (MoonBit, native + wasm-gc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: moon version --all

      - name: moon check (native)
        run: moon check --target native

      - name: moon test (native)
        run: moon test --target native

      - name: moon check (wasm-gc)
        run: moon check --target wasm-gc

      - name: moon test (wasm-gc)
        run: moon test --target wasm-gc

  native-windows:
    name: native (Windows x64, MSVC + OpenGL 后端)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'install-moonbit.ps1'
          Invoke-WebRequest -UseBasicParsing https://cli.moonbitlang.com/install/powershell.ps1 -OutFile $installer
          & $installer
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.moon\bin\moon.exe" version --all

      - name: Show toolchain versions
        run: moon version --all

      - name: Show compiler toolchain
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productDisplayVersion
          } else {
            Write-Output 'vswhere not found'
          }
          cmake --version

      - name: Create local workspace (core + native)
        # The native module depends on the core module from the same checkout;
        # the workspace file is gitignored and must be BOM-free.
        run: |
          $workspace = "members = [`n  `".`",`n  `"..`",`n]`n"
          [IO.File]::WriteAllText("$PWD\native\moon.work", $workspace, (New-Object Text.UTF8Encoding($false)))
          Get-Content "$PWD\native\moon.work"

      - name: Configure CMake
        # README 里的命令固定使用 "Visual Studio 17 2022"；托管 runner 可能装的是更新的
        # Visual Studio，这里让 CMake 选择已安装的生成器，只固定 x64 平台。
        run: |
          cmake -S native -B native/third_party/build -A x64 -DBUILD_SHARED_LIBS=OFF
          Select-String -Path native/third_party/build/CMakeCache.txt -Pattern '^CMAKE_GENERATOR:'

      - name: Build GLFW and GLAD static libraries
        run: |
          cmake --build native/third_party/build --config Release
          foreach ($lib in 'native/third_party/build/Release/lunarrender_glad.lib', 'native/third_party/build/glfw/src/Release/glfw3.lib') {
            if (-not (Test-Path $lib)) { throw "expected static library was not produced: $lib" }
            Write-Output ("found {0}" -f $lib)
          }

      - name: moon check (native module)
        working-directory: native
        run: moon check --target native

      - name: moon test (native module)
        working-directory: native
        run: moon test --target native

      - name: moon build (examples)
        working-directory: native
        run: |
          foreach ($example in 'triangle', 'textured_cube', 'multi_mesh') {
            moon build --target native --release "examples/$example"
            if ($LASTEXITCODE -ne 0) { throw "building $example failed" }
          }

      - name: Verify example artifacts
        run: |
          $root = 'native/_build/native/release/build'
          foreach ($example in 'triangle', 'textured_cube', 'multi_mesh') {
            $exe = Get-ChildItem $root -Recurse -Filter "$example.exe" -File | Select-Object -First 1
            if (-not $exe) { throw "$example.exe was not produced" }
            Write-Output ("built: {0}" -f $exe.FullName)
          }

      - name: Confirm no build outputs were committed
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Output $dirty
            git diff --stat
            git diff -- '*.mbti'
            throw 'working tree is dirty after the build; check .gitignore or commit the regenerated pkg.generated.mbti'
          }
